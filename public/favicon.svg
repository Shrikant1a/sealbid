<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favRimGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="favBgGrad" x1="10" y1="5" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Outer Isometric Shield -->
  <path d="M32 4 L56 15 V42 L32 60 L8 42 V15 Z" 
        fill="url(#favBgGrad)" 
        stroke="url(#favRimGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Inner Vault Facet -->
  <polygon points="32,22 44,28 44,38 32,44 20,38 20,28" 
           fill="#070c18" 
           stroke="url(#favRimGrad)" 
           stroke-width="2" 
           stroke-linejoin="round" />

  <!-- Glowing Center Keyhole -->
  <circle cx="32" cy="32" r="3.5" fill="#22d3ee" />
  <path d="M32 35 V41" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
</svg>
