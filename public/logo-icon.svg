<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="sbAmbientGlow" cx="60" cy="60" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Seal Ring Gradient -->
    <linearGradient id="sbRingGrad" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Ribbon S Gradient (Cyan to Sky) -->
    <linearGradient id="sbRibbonS" x1="30" y1="28" x2="75" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ribbon B Gradient (Indigo to Violet) -->
    <linearGradient id="sbRibbonB" x1="50" y1="50" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Core Vault Dark Fill -->
    <radialGradient id="sbCoreFill" cx="60" cy="60" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Subtle Soft Drop Filter -->
    <filter id="sbDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00E5FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#sbAmbientGlow)" />

  <!-- Outer Cryptographic Vault Disk -->
  <circle cx="60" cy="60" r="48" fill="url(#sbCoreFill)" stroke="url(#sbRingGrad)" stroke-width="2.5" filter="url(#sbDropShadow)" />

  <!-- Four Security Registration Ticks (0, 90, 180, 270 deg) -->
  <line x1="60" y1="8" x2="60" y2="15" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="105" x2="60" y2="112" stroke="#6366F1" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="60" x2="15" y2="60" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="105" y1="60" x2="112" y2="60" stroke="#6366F1" stroke-width="2" stroke-linecap="round" />

  <!-- Inner Concentric Precision Dashed Track -->
  <circle cx="60" cy="60" r="41" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4" />

  <!-- Interlocking Cryptographic Monogram ("S" & "B" Vault Nexus) -->
  <!-- Top Arc: Upper Loop of 'S' flowing into Seal Shackle -->
  <path d="M42 46 C42 36 50 28 60 28 C70 28 78 36 78 46 C78 52 74 56 68 58 L52 62 C46 64 42 68 42 74 C42 84 50 92 60 92 C70 92 78 84 78 74" 
        fill="none" 
        stroke="url(#sbRibbonS)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Lower Counter-Arc: Completing 'B' (Bid) & Vault Lock Body -->
  <path d="M52 38 V82 C52 82 76 84 76 70 C76 60 66 58 60 58 C68 58 74 54 74 44 C74 34 52 36 52 38 Z" 
        fill="none" 
        stroke="url(#sbRibbonB)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-opacity="0.85" />

  <!-- Center ZK Privacy Vault Aperture / Keyhole -->
  <circle cx="60" cy="60" r="6" fill="#050814" stroke="#00E5FF" stroke-width="2" />
  <circle cx="60" cy="60" r="2.5" fill="#00E5FF" />
  <path d="M60 65 V70" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
</svg>
