<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Outer Neon Cyber Rim -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Accent Core Gradient -->
    <linearGradient id="coreGrad" x1="35" y1="35" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Subtle circuit glow -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="60" cy="60" r="46" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />

  <!-- Outer Cyber Hex Shield -->
  <path d="M60 12 L98 28 C98 64 82 92 60 106 C38 92 22 64 22 28 Z"
        fill="url(#bgGrad)"
        stroke="url(#rimGrad)"
        stroke-width="3"
        stroke-linejoin="round" />

  <!-- Inner Cryptographic Vault Facet -->
  <path d="M60 22 L88 34 C88 62 76 83 60 95 C44 83 32 62 32 34 Z"
        fill="#080e1e"
        stroke="#06b6d4"
        stroke-opacity="0.3"
        stroke-width="1.5"
        stroke-dasharray="3 3" />

  <!-- Zero-Knowledge Circuit Traces -->
  <path d="M38 48 L46 48 L52 54" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <circle cx="38" cy="48" r="2" fill="#22d3ee" />
  
  <path d="M82 48 L74 48 L68 54" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <circle cx="82" cy="48" r="2" fill="#c084fc" />

  <!-- Center Vault Lock / ZK Seal Core -->
  <g filter="url(#coreGlow)">
    <!-- Lock Shackle Arch -->
    <path d="M50 54 V46 C50 40.5 54.5 36 60 36 C65.5 36 70 40.5 70 46 V54"
          fill="none"
          stroke="url(#rimGrad)"
          stroke-width="3.5"
          stroke-linecap="round" />
    
    <!-- Lock Body (Modern Beveled Octagon) -->
    <rect x="46" y="52" width="28" height="24" rx="6"
          fill="url(#coreGrad)"
          stroke="#e0f2fe"
          stroke-width="1.2" />

    <!-- Center Keyhole / ZK Eye Aperture -->
    <circle cx="60" cy="62" r="3.2" fill="#030712" />
    <path d="M58.5 63.5 L57.5 70 H62.5 L61.5 63.5 Z" fill="#030712" />

    <!-- ZK Verifier Ray Pulse -->
    <circle cx="60" cy="62" r="1.2" fill="#38bdf8" />
  </g>

  <!-- Lower Circuit Nodes -->
  <path d="M60 78 V86" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="60" cy="88" r="2.5" fill="#22d3ee" filter="url(#coreGlow)" />
</svg>
