<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Ambient Gradient -->
    <radialGradient id="sbIconGlow" cx="60" cy="60" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Facet Gradient -->
    <linearGradient id="sbHexGrad" x1="20" y1="14" x2="100" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Inner Dark Core Gradient -->
    <linearGradient id="sbCoreDark" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Prism Highlight -->
    <linearGradient id="sbPrismHighlight" x1="35" y1="25" x2="85" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="sbNeonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="sbDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Glow Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#sbIconGlow)" />

  <!-- Outer Isometric Shield / Vault Hexagon -->
  <path d="M60 8 L104 28 V76 L60 112 L16 76 V28 Z" 
        fill="url(#sbCoreDark)" 
        stroke="url(#sbHexGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#sbDropShadow)" />

  <!-- Secondary Inner Precision Facet -->
  <path d="M60 18 L94 34 V70 L60 98 L26 70 V34 Z" 
        fill="#070c18" 
        stroke="url(#sbPrismHighlight)" 
        stroke-width="1.5" 
        stroke-linejoin="round" 
        stroke-dasharray="80 3" />

  <!-- Zero-Knowledge Cryptographic Vault / Sealed Bid Gavel Nexus -->
  <g filter="url(#sbNeonGlow)">
    <!-- Top Gavel Head / Vault Shackle Prism (Dynamic Angle) -->
    <path d="M42 36 L78 36 L84 46 L36 46 Z" 
          fill="url(#sbHexGrad)" 
          stroke="#e0f2fe" 
          stroke-width="1" />
    
    <!-- Gavel / Key Shaft -->
    <path d="M57 46 V62 H63 V46 Z" 
          fill="url(#sbHexGrad)" />

    <!-- Cryptographic Shield Seal Core (Octagonal Vault Center) -->
    <polygon points="60,54 75,62 75,78 60,86 45,78 45,62" 
             fill="#0c1527" 
             stroke="url(#sbHexGrad)" 
             stroke-width="2" 
             stroke-linejoin="round" />

    <!-- Central Glowing ZK Commitment Eye / Keyhole Aperture -->
    <circle cx="60" cy="69" r="5" fill="none" stroke="#22d3ee" stroke-width="1.8" />
    <circle cx="60" cy="69" r="2.2" fill="#38bdf8" />
    <path d="M60 74 V80" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

    <!-- Left & Right Cryptographic Lattice Nodes -->
    <line x1="30" y1="52" x2="45" y2="62" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="30" cy="52" r="2.5" fill="#22d3ee" />

    <line x1="90" y1="52" x2="75" y2="62" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="90" cy="52" r="2.5" fill="#c084fc" />

    <!-- Ascending Value Bid Nodes (Bottom) -->
    <line x1="60" y1="86" x2="60" y2="96" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <circle cx="60" cy="98" r="3" fill="#22d3ee" />
  </g>
</svg>
