<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="fullBgGrad" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="fullRimGrad" x1="0" y1="0" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="textGradSeal" x1="110" y1="20" x2="200" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="textGradBid" x1="190" y1="20" x2="280" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled & positioned) -->
  <g transform="translate(10, 5) scale(0.66)">
    <!-- Ambient Glow -->
    <circle cx="60" cy="60" r="46" fill="#06b6d4" opacity="0.22" filter="url(#fullGlow)" />

    <!-- Outer Shield -->
    <path d="M60 12 L98 28 C98 64 82 92 60 106 C38 92 22 64 22 28 Z"
          fill="url(#fullBgGrad)"
          stroke="url(#fullRimGrad)"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Inner Facet -->
    <path d="M60 22 L88 34 C88 62 76 83 60 95 C44 83 32 62 32 34 Z"
          fill="#080e1e"
          stroke="#06b6d4"
          stroke-opacity="0.35"
          stroke-width="1.5"
          stroke-dasharray="3 3" />

    <!-- Circuit traces -->
    <path d="M38 48 L46 48 L52 54" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <circle cx="38" cy="48" r="2" fill="#22d3ee" />
    
    <path d="M82 48 L74 48 L68 54" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <circle cx="82" cy="48" r="2" fill="#c084fc" />

    <!-- Lock Shackle -->
    <path d="M50 54 V46 C50 40.5 54.5 36 60 36 C65.5 36 70 40.5 70 46 V54"
          fill="none"
          stroke="url(#fullRimGrad)"
          stroke-width="3.5"
          stroke-linecap="round" />
    
    <!-- Lock Body -->
    <rect x="46" y="52" width="28" height="24" rx="6"
          fill="url(#fullRimGrad)"
          stroke="#e0f2fe"
          stroke-width="1.2" />

    <circle cx="60" cy="62" r="3" fill="#030712" />
    <path d="M58.5 63.5 L57.5 70 H62.5 L61.5 63.5 Z" fill="#030712" />
    <circle cx="60" cy="62" r="1.2" fill="#38bdf8" />
  </g>

  <!-- Typography: SealBid -->
  <text x="96" y="52" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#textGradSeal)">Seal</tspan><tspan fill="url(#textGradBid)">Bid</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="98" y="70" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#94a3b8" letter-spacing="1.5">
    CONFIDENTIAL AUCTION PROTOCOL
  </text>
</svg>
