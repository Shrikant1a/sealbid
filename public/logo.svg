<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="hLogoGlow" cx="45" cy="45" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="hRingGrad" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Ribbon S Gradient -->
    <linearGradient id="hRibbonS" x1="30" y1="28" x2="75" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ribbon B Gradient -->
    <linearGradient id="hRibbonB" x1="50" y1="50" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Core Dark Fill -->
    <radialGradient id="hCoreDark" cx="60" cy="60" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Text Seal Gradient -->
    <linearGradient id="textSeal" x1="100" y1="30" x2="180" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Text Bid Gradient -->
    <linearGradient id="textBid" x1="180" y1="30" x2="270" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (scaled & centered) -->
  <g transform="translate(10, 5) scale(0.68)">
    <!-- Ambient Glow -->
    <circle cx="60" cy="60" r="54" fill="url(#hLogoGlow)" />

    <!-- Outer Cryptographic Vault Disk -->
    <circle cx="60" cy="60" r="48" fill="url(#hCoreDark)" stroke="url(#hRingGrad)" stroke-width="3" />

    <!-- Security Registration Ticks -->
    <line x1="60" y1="8" x2="60" y2="15" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="60" y1="105" x2="60" y2="112" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="60" x2="15" y2="60" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="105" y1="60" x2="112" y2="60" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Concentric Track -->
    <circle cx="60" cy="60" r="41" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.4" />

    <!-- Interlocking Monogram ('S' & 'B') -->
    <path d="M42 46 C42 36 50 28 60 28 C70 28 78 36 78 46 C78 52 74 56 68 58 L52 62 C46 64 42 68 42 74 C42 84 50 92 60 92 C70 92 78 84 78 74" 
          fill="none" 
          stroke="url(#hRibbonS)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <path d="M52 38 V82 C52 82 76 84 76 70 C76 60 66 58 60 58 C68 58 74 54 74 44 C74 34 52 36 52 38 Z" 
          fill="none" 
          stroke="url(#hRibbonB)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-opacity="0.9" />

    <!-- Center ZK Privacy Vault Aperture -->
    <circle cx="60" cy="60" r="6" fill="#050814" stroke="#00E5FF" stroke-width="2" />
    <circle cx="60" cy="60" r="2.5" fill="#00E5FF" />
    <path d="M60 65 V70" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: SealBid -->
  <text x="100" y="52" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#textSeal)">Seal</tspan><tspan fill="url(#textBid)">Bid</tspan>
  </text>

  <!-- Subtitle: CONFIDENTIAL AUCTION PROTOCOL -->
  <text x="102" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">
    CONFIDENTIAL AUCTION PROTOCOL
  </text>
</svg>
