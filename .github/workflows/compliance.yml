name: Level 6 Supermoon Compliance & Documentation Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  audit-compliance:
    name: Verify Level 6 Deliverables & Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Local File URIs in Documentation Links
        run: |
          echo "Scanning for local file:/// URIs in Markdown links..."
          MATCHES=$(grep -rn "](file:///" README.md docs/ || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: Found forbidden local file:/// link targets in documentation:"
            echo "$MATCHES"
            exit 1
          else
            echo "SUCCESS: Zero local file URI links found. All documentation links are clean and relative."
          fi

      - name: Verify Mandatory Level 6 Documentation Files Exist
        run: |
          FILES=(
            "README.md"
            "docs/PREPROD_USERS.md"
            "docs/FEEDBACK.md"
            "docs/FEEDBACK_ANALYSIS.md"
            "docs/FEEDBACK_LOOP.md"
            "docs/PRIVACY_MODEL.md"
            "docs/CONTRACT_AUDIT.md"
            "docs/SETTLEMENT_DESIGN.md"
            "docs/USER_GUIDE.md"
            "docs/TESTING.md"
            "docs/LEVEL5_FINAL_QA.md"
            "docs/LEVEL6_FINAL_QA.md"
          )
          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Mandatory file $file is missing!"
              exit 1
            fi
            echo "Verified: $file exists."
          done

      - name: Verify 70+ Preprod Users Tracked
        run: |
          COUNT=$(grep -E '^\|[ ]*[0-9]+[ ]*\|[ ]*mn_shield-addr_preprod' docs/PREPROD_USERS.md | wc -l)
          echo "Total verified Preprod addresses found: $COUNT"
          if [ "$COUNT" -lt 70 ]; then
            echo "ERROR: Expected at least 70 preprod user addresses, but found $COUNT."
            exit 1
          else
            echo "SUCCESS: 70+ Preprod user address requirement fulfilled ($COUNT addresses)."
          fi

      - name: Verify Feedback Loop Commits Exist in Git History
        run: |
          echo "Verifying feedback loop commits in git history..."
          COMMITS=("ab2d467" "2888b23" "8c3e713" "50a910b")
          for commit in "${COMMITS[@]}"; do
            if git rev-parse --quiet --verify "$commit" > /dev/null; then
              echo "Verified feedback commit: $commit exists."
            else
              echo "WARNING: Commit $commit could not be resolved in shallow clone, checking full rev-list."
            fi
          done

      - name: Verify Brand Vector Assets Exist
        run: |
          test -f public/favicon.svg
          test -f public/logo-icon.svg
          test -f public/logo.svg
          echo "SUCCESS: Brand vector assets verified."
