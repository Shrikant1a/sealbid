name: SealBid CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Compact CLI and Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.compact/bin" >> $GITHUB_PATH

      - name: Download Compact Compiler Toolchain
        run: |
          compact update
          compact --version

      - name: Compile Compact Contract
        run: npm run compile:contract

      - name: Run Test Suite
        run: npm run test

      - name: Strict TypeScript Verification
        run: npm run typecheck

      - name: Production Vite Build
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -d managed
          echo "Production build and compiled contract verified successfully."
