name: SealBid CI/CD Pipeline (Level 5 Full Moon)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build, Typecheck & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Brand Assets and Favicon
        run: |
          test -f public/favicon.svg
          test -f public/logo-icon.svg
          test -f public/logo.svg
          echo "Brand assets validated."

      - name: Strict TypeScript Verification
        run: npm run typecheck

      - name: Run Vitest Unit Test Suite
        run: npm run test

      - name: Install Compact Toolchain (Optional / Network Tolerant)
        run: |
          set +e
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          if command -v compact >/dev/null 2>&1; then
            compact update || true
            compact --version || true
            npm run compile:contract || true
          else
            echo "Compact compiler toolchain unavailable in runner, using managed contract bindings."
          fi
          set -e

      - name: Production Vite Build
        run: npm run build

      - name: Verify Build Output & Managed Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/favicon.svg
          test -d managed
          echo "Production build and managed contract bindings verified."

      - name: Upload Production Build Artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: sealbid-dist-node22
          path: dist/
          retention-days: 14
